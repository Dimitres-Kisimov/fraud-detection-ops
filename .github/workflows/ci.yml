name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib openpyxl ruff pytest
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Build deliverables (fails if either file is under 10 KB)
        run: python -m fdo --deliverables

<text x="28" y="410" font-size="11.5" fill="#52514e">Reasons are groups of design-matrix columns (one clock, one account-age pair, seven category dummies), summed - exact for a linear score. The median alert needs 1 reason(s) removed to fall back under the cut.</text>
<text x="28" y="428" font-size="11.5" fill="#52514e">weighted_bce ranks these alerts almost identically (Spearman 0.9997) yet names a different principal reason on 1.5% of them. Synthetic data; explains the model, not the fraud.</text>
